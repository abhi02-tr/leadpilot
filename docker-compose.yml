version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadpilot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadpilot
    ports:
      - "5433:5432"
    volumes:
      - leadpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  leadpilot_postgres_data:
